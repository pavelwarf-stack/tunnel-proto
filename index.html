<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>РКН против ВПН — прототип v2</title>
<!--
  ПРОТОТИП v2 · инвестор-демо 20.08 · рескин по Figma Миши (20.08 вечер)
  Один файл. Внешние запросы: только шрифт Unbounded (Google Fonts) + ассеты assets/figma/.
  Работает с file:// и через http.server (класть рядом с папкой assets/).
  ЦВЕТА ЛАГЕРЕЙ (канон 20.08): РКН — синий #1B72ED, ВПН — красный #FF0F4B. Валюта — байты.

  ГДЕ ЧТО КРУТИТЬ (весь контент — три точки, разметку трогать не надо):
    1) CSS-переменные --rkn / --vpn в :root  — палитры лагерей (единственный источник цвета);
    2) const ART   — весь арт (эмодзи/SVG-строки/<img src="assets/figma/...">);
    3) const CONFIG — ВСЁ остальное: пулы карт, экономика, тексты воронки,
       стор, онбординг, промокод, задания, война, топ, обучение (tutorial),
       мини-игры (minigames: взлом шифра + обход капчи играбельны), тосты.
  Рендер целиком генерится из ART+CONFIG при старте.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;500;600;700;800;900&family=Geist:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#070710; --panel:rgba(255,255,255,.05); --card:rgba(255,255,255,.04); --card2:rgba(255,255,255,.08);
  --text:#fff; --muted:rgba(255,255,255,.6); --muted2:#8A90B2; --line:rgba(255,255,255,.1);
  /* ПАЛИТРЫ ЛАГЕРЕЙ — точка рескина. РКН = синий, ВПН = красный (токены Figma) */
  --rkn:#1B72ED; --rkn2:#5EA0FF; --rkndim:rgba(27,114,237,.15);
  --rknG:linear-gradient(180deg,#1B72ED,#0053C8);
  --vpn:#FF0F4B; --vpn2:#FF5B82; --vpndim:rgba(255,15,75,.15);
  --vpnG:linear-gradient(180deg,#FF0F4B,#99092D);
  --gold:#FFD700; --ios:#0a84ff; --brand:#7c5cff; --brand2:#cfc4ff; --branddim:#191430;
  /* светлая кромка CTA (аудит-2, A§4/B1/B9/C-1): белый градиент рисуется ПОВЕРХ заливки
     кнопки (подложка тем же филом в border-box), иначе полупрозрачный белый пачкается
     о тёмный фон страницы → грязно-серый ободок. Форма — по пробам рендеров Миши:
     сверху ярче и гаснет к низу + подсвеченные бока по всей высоте */
  --edgeV:linear-gradient(180deg,rgba(255,255,255,.25),rgba(255,255,255,0) 60%);
  --edgeH:linear-gradient(90deg,rgba(255,255,255,.35),rgba(255,255,255,0) 50%,rgba(255,255,255,.35));
  --f:'Unbounded',-apple-system,'SF Pro Text','Segoe UI',Roboto,sans-serif;
  /* СЦЕНА (волна 19): всё приложение живёт в кадре 390×844 дизайн-пикселей (#stage),
     который целиком масштабируется под реальный экран (min по ширине/высоте),
     центрируется, поля — летербокс #070710. Композиция пиксель-в-пиксель на любом
     айфоне (375×667…430×932); на десктопе min по высоте даёт ту же «раму телефона»
     ≈ высота × 0.462, что и раньше. --colw оставлен = ширине сцены: на него завязаны
     max-width старых слоёв, внутри сцены это просто «во всю ширину». */
  --colw:390px;
  --sc:1;   /* безразмерный скейл сцены — считает fitStage() в JS (scale() не ест length) */
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg);color:var(--text);
  font-family:var(--f);height:100%;overflow:hidden;
  overscroll-behavior:none;user-select:none;-webkit-user-select:none}
/* сцена: transform делает #stage containing block'ом для ВСЕХ position:fixed
   потомков (шиты/нав/коуч/оверлеи) — они автоматически живут в дизайн-координатах
   390×844 и клипятся кадром сцены. Скролл контента — внутри #appscroll (раньше body). */
#stage{position:fixed;width:390px;height:844px;overflow:hidden;background:var(--bg);
  left:calc((100vw - 390px * var(--sc)) / 2);
  top:calc((100dvh - 844px * var(--sc)) / 2);
  transform:scale(var(--sc));transform-origin:0 0}
#appscroll{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;scrollbar-width:none}
#appscroll::-webkit-scrollbar{display:none}
body[data-side="rkn"]{--acc:var(--rkn);--acc2:var(--rkn2);--accdim:var(--rkndim);--accG:var(--rknG);--accRGB:27,114,237}
body[data-side="vpn"]{--acc:var(--vpn);--acc2:var(--vpn2);--accdim:var(--vpndim);--accG:var(--vpnG);--accRGB:255,15,75}
button{font-family:inherit;cursor:pointer}
h3.sect{font:800 16px var(--f);margin:18px 0 10px}
img{-webkit-user-drag:none}
/* базовые атомы дизайна: панель / бейдж / главная кнопка (токены Figma) */
.badge{display:inline-block;background:rgba(255,255,255,.1);border-radius:6px;
  padding:4px 8px;font:700 12px var(--f);color:#fff}
.btnp{background:linear-gradient(135deg,#3380FF,#1C7BFF) padding-box,
  var(--edgeV) border-box,var(--edgeH) border-box,
  linear-gradient(135deg,#3380FF,#1C7BFF) border-box;
  border:2px solid transparent;border-radius:20px;color:#fff;
  font:700 16px var(--f);text-transform:uppercase;letter-spacing:.02em;
  box-shadow:0 4px 0 #207BFF,0 -4px 0 #207BFF,inset 0 9px 6.5px rgba(255,255,255,.25)}
.btnp:active{transform:translateY(2px);box-shadow:0 2px 0 #207BFF,0 -2px 0 #207BFF,inset 0 9px 6.5px rgba(255,255,255,.25)}
.btnp.sm{border-radius:12px;font-size:12px;text-transform:none;
  box-shadow:0 1px 0 #207BFF,0 -1px 0 #207BFF,inset 0 4px 3px rgba(255,255,255,.25)}
/* зелёный вариант CTA — контур приложения ВПН: в фреймах подарка (1969/16665)
   кнопки зелёные под фирменный цвет «ПОДКЛЮЧЁН» (аудит 21.08) */
.btng{background:linear-gradient(135deg,#10B981,#06A671) padding-box,
  var(--edgeV) border-box,var(--edgeH) border-box,
  linear-gradient(135deg,#10B981,#06A671) border-box;
  border:2px solid transparent;border-radius:20px;color:#fff;
  font:700 16px var(--f);text-transform:uppercase;letter-spacing:.02em;
  box-shadow:0 4px 0 #0A9D6C,0 -4px 0 #0A9D6C,inset 0 9px 6.5px rgba(255,255,255,.25)}
.btng:active{transform:translateY(2px);box-shadow:0 2px 0 #0A9D6C,0 -2px 0 #0A9D6C,inset 0 9px 6.5px rgba(255,255,255,.25)}
.btng.sm{border-radius:12px;font-size:12px;text-transform:none;
  box-shadow:0 1px 0 #0A9D6C,0 -1px 0 #0A9D6C,inset 0 4px 3px rgba(255,255,255,.25)}

/* ---------- шапка: профиль + пилюля валюты ---------- */
header{padding:14px 16px 8px;position:sticky;top:0;z-index:30;
  background:linear-gradient(180deg,var(--bg) 75%,transparent)}
.statusrow{display:flex;align-items:center;justify-content:space-between;gap:10px}
.profile{display:flex;align-items:center;gap:10px;cursor:pointer;min-width:0}
.profile .pava{width:40px;height:40px;border-radius:50%;border:2px solid var(--acc);
  overflow:hidden;flex-shrink:0;display:flex}
.profile .pava img,.profile .pava svg{width:100%;height:100%;object-fit:cover}
.profile .pava span{font-size:24px;margin:auto}
.profile .pn{font:700 14px var(--f);white-space:nowrap}
.profile .pt{font:600 12px var(--f);color:var(--acc);white-space:nowrap}
.curpill{display:flex;align-items:center;gap:7px;background:rgba(255,255,255,.1);
  border-radius:20px;padding:9px 14px}
.curpill .chipIc{width:18px;height:18px}
.curpill b{font:700 12px var(--f)}
.chipIc{display:inline-flex;width:15px;height:15px;vertical-align:-2px}
.chipIc svg,.chipIc img{width:100%;height:100%}

/* ---------- вьюхи и навигация ---------- */
main{padding-bottom:110px}
.view{display:none;padding:0 16px}
.view.on{display:block}
nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:var(--colw);
  height:80px;display:flex;gap:2px;padding:8px 6px calc(8px + env(safe-area-inset-bottom));
  border-radius:24px 24px 0 0;z-index:30;
  background:linear-gradient(135deg,rgba(255,255,255,.06),rgba(7,7,16,.97) 55%),#070710;
  box-shadow:0 -2px 0 var(--acc),inset 0 1px 0 rgba(255,255,255,.08)}
nav button{flex:1;min-width:0;border:0;background:transparent;color:var(--muted2);
  font:500 11px var(--f);padding:6px 0;border-radius:14px;white-space:nowrap;
  display:flex;flex-direction:column;align-items:center;gap:5px}
nav button .nic{width:22px;height:22px;display:flex;color:inherit}
nav button .nic svg,nav button .nic img{width:100%;height:100%}
nav button.on{color:var(--acc);font-weight:700}
nav button.on .nic{filter:drop-shadow(0 0 6px rgba(var(--accRGB),.6))}

/* ---------- выбор лагеря (Figma волна 7: 108:20094 нейтраль / 103:16236 ВПН / 103:16378 РКН, кадр 390×844) ---------- */
.campsel{position:fixed;top:0;bottom:0;left:0;right:0;margin:0 auto;width:100%;max-width:var(--colw);
  background:var(--bg);z-index:100;overflow:hidden;text-align:center}
/* нижняя виньетка (Figma rect y=320, radius 32, layer-blur): нейтраль — белая→чёрная,
   при выборе тонируется лагерем; клипится campsel'ом — за колонку не выходит */
.csbg{position:absolute;left:-24px;right:-24px;top:320px;bottom:-24px;border-radius:32px 32px 0 0;
  pointer-events:none;filter:blur(5.15px);
  background:linear-gradient(180deg,rgba(255,255,255,.01),rgba(191,191,191,.26) 25%,rgba(128,128,128,.5) 50%,rgba(64,64,64,.75) 75%,#000)}
.campsel.selvpn .csbg{filter:blur(10px);
  background:linear-gradient(180deg,rgba(255,69,69,.01),rgba(191,52,52,.26) 25%,rgba(128,35,35,.5) 50%,rgba(64,17,17,.75) 75%,#000)}
.campsel.selrkn .csbg{filter:blur(10px);
  background:linear-gradient(180deg,rgba(27,114,237,.01),rgba(20,86,178,.26) 25%,rgba(14,57,119,.5) 50%,rgba(7,29,59,.75) 75%,#000)}
.csHead{position:absolute;top:81px;left:0;right:0;display:flex;flex-direction:column;align-items:center;gap:12px}
.csHead h1{margin:0;font:900 28px/1.25 var(--f);color:#fff}
.csHead p.sub{margin:0;width:344px;max-width:calc(100% - 32px);font:400 14px/1.5 var(--f);color:rgba(255,255,255,.6)}
/* сцена карточек: карты «уходят» за края экрана (Figma: ВПН x=-171 w=341, РКН x=220 w=327), VS по центру */
.pick{position:absolute;top:285px;left:0;right:0;height:241px}
.pick .vs{position:absolute;top:115px;left:50%;transform:translateX(-50%);font:900 16px/1.25 var(--f);color:#fff}
.pcard{position:absolute;top:0;height:241px;border-radius:24px;cursor:pointer;
  background:var(--card);transition:transform .15s}
.pcard:active{transform:scale(.97)}
/* рамка — кольцо ::before (mask-composite), чтобы градиент лагеря красил ТОЛЬКО обводку, не заливку */
.pcard::before{content:'';position:absolute;inset:0;border-radius:24px;padding:2px;pointer-events:none;
  background:rgba(255,255,255,.1);
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
  -webkit-mask-composite:xor;mask-composite:exclude}
.pcard[data-c="vpn"]{right:calc(50% + 25px);width:341px;top:1px}
.pcard[data-c="rkn"]{left:calc(50% + 25px);width:327px}
/* выбранная карта: кольцо 4px градиентом лагеря (Figma; свечения нет — виньетку красит .csbg) */
.pcard.sel::before{padding:4px}
.pcard[data-c="vpn"].sel::before{background:var(--vpnG)}
.pcard[data-c="rkn"].sel::before{background:var(--rknG)}
/* персонажи: нейтральный и «выбранный» варианты оба в DOM, .sel переключает; размеры/офсеты — точные из Figma */
.pcard .chr{position:absolute;pointer-events:none}
.pcard .chr img{width:100%;height:100%;display:block}
.pcard .chr.selc{display:none}
.pcard.sel .chr.selc{display:block}
.pcard.sel .chr.neu{display:none}
.pcard[data-c="vpn"] .chr.neu{right:0;top:-45px;width:163px;height:160px}
.pcard[data-c="vpn"] .chr.selc{right:2px;top:-43px;width:157px;height:154px}
.pcard[data-c="rkn"] .chr.neu{left:11px;top:-44px;width:155px;height:158px}
.pcard[data-c="rkn"] .chr.selc{left:16px;top:-42px;width:140px;height:151px}
/* текст-блок центрирован в ВИДИМОЙ части карты (Figma: 122px, отступ 26 от «внутреннего» края, y=142) */
.pcard .tb{position:absolute;top:142px;width:122px;display:flex;flex-direction:column;align-items:center;gap:6px}
.pcard[data-c="vpn"] .tb{right:26px}
.pcard[data-c="rkn"] .tb{left:26px}
.pcard .tb b{font:800 32px/1.25 var(--f)}
.pcard[data-c="rkn"] .tb b{color:var(--rkn)} .pcard[data-c="vpn"] .tb b{color:var(--vpn)}
.pcard .camp-badge{background:rgba(255,255,255,.1);border-radius:6px;padding:4px 6px;font:700 12px/1.25 var(--f);color:#fff}
/* инфо-пилюля (Figma: 359×65, y=555, radius 20) */
.csinfo{position:absolute;top:555px;left:15px;right:16px;height:65px;display:flex;gap:8px;align-items:center;
  text-align:left;background:rgba(255,255,255,.1);border-radius:20px;padding:10px 16px}
.csinfo .ai{width:24px;height:24px;flex-shrink:0;display:flex}
.csinfo .ai img,.csinfo .ai svg{width:100%;height:100%}
.csinfo div{font:400 12px/21px var(--f);color:#fff}
/* CTA «ПРОДОЛЖИТЬ» — в цвет выбранного лагеря (Figma modal-btn 358×70, отступ снизу 40) */
.cbtn{position:absolute;left:16px;right:16px;bottom:40px;height:70px;border-radius:20px;
  border:2px solid transparent;color:#fff;font:700 16px var(--f);text-transform:uppercase;
  opacity:0;pointer-events:none;transform:translateY(8px);transition:.2s}
.cbtn.show{opacity:1;pointer-events:auto;transform:none}
.cbtn.show:active{transform:translateY(2px)}
.campsel.selvpn .cbtn{background:linear-gradient(135deg,#FF0F4B,#D40438) padding-box,
  var(--edgeV) border-box,var(--edgeH) border-box,
  linear-gradient(135deg,#FF0F4B,#D40438) border-box;
  box-shadow:0 4px 0 #FF0F4B,0 -4px 0 #FF0F4B,inset 0 9px 6.5px rgba(255,255,255,.25)}
.campsel.selrkn .cbtn{background:linear-gradient(135deg,#3380FF,#1C7BFF) padding-box,
  var(--edgeV) border-box,var(--edgeH) border-box,
  linear-gradient(135deg,#3380FF,#1C7BFF) border-box;
  box-shadow:0 4px 0 #207BFF,0 -4px 0 #207BFF,inset 0 9px 6.5px rgba(255,255,255,.25)}

/* ---------- ШТАБ (Figma: главный экран-тапалка) ---------- */
.tapwrap{display:flex;flex-direction:column;align-items:center;padding-top:16px}  /* фрейм 2010: зазор от шапки 24 → 16 (волна 20: место под баннер игр) */
/* карточка «БИТВА ЗА СЕТЬ» */
.battle{width:100%;background:var(--panel);border:1px solid var(--line);border-radius:16px;
  padding:12px 14px;backdrop-filter:blur(8px)}
.battle .bhead{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:10px}
.battle .bhead .bt{font:900 12px var(--f);color:#5F5F80;letter-spacing:.06em;padding-top:2px}
/* штаб (фрейм 2010, вердикт Павла 22.08 аудит-2 п.1): титул ДВЕ крупные строки по центру
   «БИТВА / ЗА СЕТЬ» (кегль 13/15 по промеру рефа, cap 18@2x), блок вертикально отцентрован
   против процентов. На экране Битвы реюз того же компонента остаётся ОДНОЙ малой строкой
   (так и у Миши во фрейме войны) — двухстрочный стиль скоупится классом .bt2 */
.battle .bhead .bt2{font:900 13px/15px var(--f);text-align:center;letter-spacing:.08em;
  padding-top:0;align-self:center}
.battle .bhead .kb b{color:var(--rkn)} .battle .bhead .kv b{color:var(--vpn)}
.battle .bhead b{display:block;font:900 14px var(--f)}
.battle .bhead span{font:400 12px var(--f);color:var(--muted)}
.battle .bhead .kv{text-align:right}
.battle .tug{height:16px;border-radius:100px;overflow:hidden;display:flex}
.battle .tug .b{background:linear-gradient(90deg,#1B72ED,#0F4187)}
.battle .tug .r{background:linear-gradient(90deg,#FF0F4B,#99092D);flex:1}
.battle .brow{display:flex;justify-content:space-between;align-items:center;margin-top:9px;
  font:400 12px var(--f);color:var(--muted)}
.battle .brow b{font:700 12px var(--f);color:#fff}
.battle .brow .tmr{color:var(--gold);font-weight:700}
/* промо-баннер события на штабе — дизайн Миши (фрейм 2010 = 164:13240): панель 68px
   #14141C r16, оранжевый бейдж «Событие», имя события 14px, вырезной арт справа
   в клипе (у ВПН — Дугин с лазерами; крой фила: right-кроп 67.8% ширины листа),
   синяя кнопка-стрелка 40×24 = мини-.btnp; тап по всей панели = ивент-шит */
.evpromo{position:relative;display:block;width:100%;height:68px;border-radius:16px;
  background:#14141C;margin-top:8px;cursor:pointer;overflow:hidden}
.evpromo .epArt{position:absolute;top:-23px;right:-86px;width:272px;height:239px;
  overflow:hidden;transform:rotate(.2deg);pointer-events:none}
.evpromo .epArt img{display:block;width:147.4%;height:100%;margin:7px 0 0 -40.4%}
.evpromo .epArt.cover{top:0;right:0;width:186px;height:68px;transform:none;
  -webkit-mask-image:linear-gradient(90deg,transparent,#000 45%);
  mask-image:linear-gradient(90deg,transparent,#000 45%)}
.evpromo .epArt.cover img{width:100%;height:100%;margin:0;object-fit:cover}
.evpromo .epBadge{position:absolute;left:16px;top:13px;padding:2px 6px;border-radius:6px;
  background:linear-gradient(90deg,#FC8319,#CA6B18);font:700 10px/1.24 var(--f);color:#fff}
.evpromo .epTitle{position:absolute;left:16px;top:37px;font:700 14px/1.24 var(--f);color:#fff;
  max-width:230px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.evpromo .epGo{position:absolute;right:12px;top:20px;width:40px;height:24px;border-radius:8px;
  display:flex;align-items:center;justify-content:center;border:1px solid transparent;
  background:linear-gradient(135deg,#3380FF,#1C7BFF) padding-box,
  var(--edgeV) border-box,var(--edgeH) border-box,
  linear-gradient(135deg,#3380FF,#1C7BFF) border-box;
  box-shadow:0 1px 0 #207BFF,0 -1px 0 #207BFF,inset 0 9px 6.5px rgba(255,255,255,.25)}
.evpromo .epGo svg{display:block}
/* баннер мини-игр на штабе (волна 20, слово Павла 22.08 «игры уберём снизу — тесно»):
   та же панель, что событие (68px #14141C r16), бейдж золотой для отличимости,
   арт справа — реюз тайла игры с фейд-маской (.epArt.cover) */
.gamespromo{margin-top:8px}
.gamespromo .epBadge{background:linear-gradient(90deg,#FFD700,#D9A400);color:#070710}
.gamespromo .epArt.cover img{object-position:center 30%}
/* шапка экрана «Игры»: кнопка «назад в штаб» (в навигации таба больше нет) */
.ghead{display:flex;align-items:center;gap:10px}
.gback{width:32px;height:32px;flex:none;border-radius:10px;border:1px solid var(--line);
  background:var(--panel);color:#fff;display:flex;align-items:center;justify-content:center;
  cursor:pointer;padding:0}

/* объект тапа (Figma волна 9: персонаж команды 213×261 + 3 концентрических кольца 4px
   в цвет команды, альфы .05/.07/.10 изнутри наружу, свечение командным цветом) */
.tapzone{width:285px;height:285px;border-radius:50%;   /* фрейм 2010: 285px */
  display:flex;align-items:center;justify-content:center;
  transition:transform .06s ease;position:relative;margin-top:24px;font-size:96px;overflow:visible}  /* фрейм 2010: зазор от баннера 61 → 24 (волна 20: второй баннер; внешнее кольцо выступает на 23px — не наезжает) */
.tapzone::before,.tapzone::after{content:''}
.tapzone::before,.tapzone::after,.tapzone .ring3{position:absolute;left:50%;top:50%;
  transform:translate(-50%,-50%);border-radius:50%;pointer-events:none;
  box-shadow:0 0 28px rgba(var(--accRGB),.31),0 0 85px rgba(var(--accRGB),.15)}
.tapzone::before{width:83.6%;height:83.6%;border:4px solid rgba(var(--accRGB),.05)}   /* 238/284.7 */
.tapzone::after{width:99.8%;height:99.8%;border:4px solid rgba(var(--accRGB),.07)}    /* 284/284.7 */
.tapzone .ring3{width:116.4%;height:116.4%;border:4px solid rgba(var(--accRGB),.1)}   /* 331/284.7 */
.tapzone:active{transform:scale(.965)}
.tapzone #tapArt{display:flex;width:100%;height:100%;align-items:center;justify-content:center}
.tapzone #tapArt img{width:74.8%;height:91.7%;object-fit:contain;opacity:.9;pointer-events:none;
  margin-top:-4%}   /* 213×261 в контейнере 284.7, y10 из фрейма */
.taphint{margin-top:6px;color:var(--muted);font:400 12px var(--f);text-align:center}
.taphint b{color:var(--acc2)}
.float{position:absolute;font:900 16px var(--f);color:#fff;pointer-events:none;
  background:rgba(var(--accRGB),.2);border:1px solid rgba(255,255,255,.2);border-radius:9.5px;
  padding:4px 9px;box-shadow:0 0 14px rgba(var(--accRGB),.45);
  animation:fl 1s ease-out forwards;z-index:20;white-space:nowrap}
@keyframes fl{from{opacity:1;transform:translateY(0)}to{opacity:0;transform:translateY(-90px)}}
/* энергия */
.energy{width:350px;max-width:100%;margin-top:10px}  /* фрейм 2010: полоса 350px; зазор 18 → 10 (волна 20) */
.energy .bar{height:10px;border-radius:100px;background:rgba(255,255,255,.1);overflow:hidden;
  box-shadow:0 0 12px rgba(var(--accRGB),.25)}
.energy .bar i{display:block;height:100%;border-radius:100px;transition:width .2s;
  background:linear-gradient(90deg,rgba(255,255,255,.5),#fff);
  box-shadow:0 0 10px rgba(255,255,255,.6)}
.energy .row{display:flex;justify-content:center;gap:5px;align-items:baseline;
  font:400 13px var(--f);margin-top:8px}
.energy .row .l{color:#fff}
.energy .row b{color:#fff;font:800 14px var(--f)}
.energy .row .mx{color:#9A9AB6;font:600 13px var(--f)}
/* ---------- ИГРЫ — свой таб (Figma, волна 6): тизер «СКОРО» + сетка 2×3 ---------- */
/* тизер «СКОРО» — по фрейму мини-игр (90:7149): жёлтый заголовок #FFD700 без панели-коробки
   (коробка была отсебятиной вёрстки — аудит 21.08) */
.teaser{margin-bottom:16px}
/* кегли тизера и меток — по фрейму 90:7149 (аудит-2 C2: наши 16/14/13 были крупнее,
   «Перехват пакетов» ломался в 2 строки и ряды плиток разъезжались) */
.teaser b{display:block;font:800 14px var(--f);color:#FFD700;text-transform:uppercase;
  letter-spacing:.02em;margin-bottom:8px}
.teaser p{margin:0;font:400 12px/1.5 var(--f);color:var(--muted)}
.ggrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.gtile{position:relative;background:var(--panel);border-radius:16px;padding:12px;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;gap:10px}
.gtile .gi{width:100%;max-width:125px;border-radius:16px;overflow:hidden;display:flex}
.gtile .gi img{width:100%;height:auto;display:block}
.gtile b{font:700 12px var(--f);letter-spacing:-.02em;text-align:center}
.gtile .soon{position:absolute;top:8px;right:8px;background:#3380FF;color:#fff;
  border-radius:8px;padding:3px 7px;font:900 8px var(--f);letter-spacing:.05em}
.gtile.play{border:1px solid var(--accdim)}
.gtile.wob{animation:wob .45s ease}
/* бейдж шифра (волна 21): «×N MM:SS» при бусте дохода, «перезарядка MM:SS» при кулдауне */
.gtile .gbadge{position:absolute;top:8px;right:8px;background:#2e9e5b;color:#fff;
  border-radius:8px;padding:3px 7px;font:800 9px var(--f);letter-spacing:.03em;font-variant-numeric:tabular-nums}
.gtile .gbadge.cd{background:rgba(255,255,255,.14);color:var(--muted)}

/* ---------- КАРТЫ (Figma: «Карты улучшений») ---------- */
.cardshead{font:900 20px var(--f);margin:6px 0 12px}
.income{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.1);
  border:1px solid #23273F;border-radius:12px;padding:6px 14px;margin-bottom:20px}  /* фрейм: пилюля 27pt, до имбы 20 (аудит-2 B20/B21) */
.income .lbl{font:700 10px var(--f);color:#9A9AB6;letter-spacing:.08em}
.income b{font:700 14px var(--f)}
.income .ph{color:rgba(255,255,255,.5);font:600 13px var(--f)}
.income .x2{margin-left:auto;color:var(--acc2);font:700 11px var(--f)}
.codechip{display:none;margin:0 0 12px;width:100%;border:1.5px dashed var(--acc);background:var(--accdim);
  color:#fff;border-radius:14px;padding:12px;font:700 13px var(--f)}
.codechip.show{display:block}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px 12px;margin-top:2px}  /* ряды 16 по фрейму (аудит-2 B21) */
.gcard{background:transparent;border:1px solid var(--line);border-radius:16px;   /* ячейка прозрачная, карту рисует рамка (аудит-2 B17) */
  position:relative;overflow:hidden;cursor:pointer;display:flex;flex-direction:column}
.gcard.wob{animation:wob .45s ease}
@keyframes wob{0%{transform:rotate(0)}25%{transform:rotate(-2.2deg) scale(1.02)}55%{transform:rotate(1.8deg)}100%{transform:rotate(0)}}
/* картинка-полоса сверху: img cover или эмодзи на тёмной подложке */
.gcard .band{height:100px;background:linear-gradient(160deg,#101024,#1a1a30);position:relative;
  display:flex;align-items:center;justify-content:center;font-size:44px;
  display:flex;align-items:center;justify-content:center;font-size:44px;flex-shrink:0}
.gcard .band img{width:100%;height:100%;object-fit:cover;display:block}
/* строка бейджей на тумбе: Ур.N чёрная пилюля с БЕЛЫМ жирным текстом покрупнее
   (вердикт Павла 22.08 аудит-2 п.2, промер рефа cards-vpn: шрифт ≈13, пилюля ≈24px);
   метка ×2 — сразу СПРАВА от уровня; ЛЕГЕНДАРНАЯ — у правого края */
.gcard .thh{position:absolute;top:8px;left:8px;right:8px;display:flex;align-items:flex-start;
  gap:14px;z-index:2;pointer-events:none}
.gcard .bLv{background:#000;color:#fff;border:1px solid rgba(255,255,255,.25);
  font:800 13px var(--f);border-radius:9px;padding:3px 9px;flex-shrink:0}
.gcard .bLeg{margin-left:auto;background:#3380FF;color:#fff;
  font:700 10px var(--f);border-radius:6px;padding:2px 6px;
  box-shadow:0 0 24px rgba(51,128,255,.31),inset 0 1px 2px rgba(255,255,255,.1)}
.gcard .gbody{padding:12px;display:flex;flex-direction:column;gap:8px;flex:1}
.gcard .nm{font:700 14px/1.3 var(--f)}
/* сетка 2xN — метрики карточки из фрейма 108:19009: имя 13/16 с резервом на 2 строки
   (имя y12 -> статы y53), доход 12px c чипом 12, кнопка h32 прижата к низу */
.gcard:not(.imba) .nm{font:700 13px/16px var(--f);min-height:32px}
.gcard .val{display:flex;gap:4px;align-items:center;font:700 12px var(--f)}
.gcard .val .chipIc{width:12px;height:12px}
.gcard .val .ph{color:rgba(255,255,255,.5);font-weight:700}
.gcard .note{font:400 10px/1.4 var(--f);color:var(--muted)}
.gcard.imba .note{color:#fff;margin-top:-4px}
.gcard .buyb{margin-top:auto;display:flex;gap:4px;align-items:center;justify-content:center;
  height:32px;padding:0 8px;width:100%;color:#fff}
.gcard .own{margin-top:auto;text-align:center;font:700 12px var(--f);color:var(--acc2);
  background:rgba(255,255,255,.06);border-radius:12px;padding:10px 8px}
.gcard .lv{color:var(--muted)}
.gcard.poor .buyb{opacity:.4}
/* фейк-запрос на сервер при прокачке (правка Саши 21.08, как в Хомяке): кнопка → лоадер */
/* лоадер «запрос на сервер» — белая точка из фрейма Миши 162:12839 (Ø19 в кнопке 32px,
   Ø40 в кнопке 70px), мягкое свечение + пульс */
.ldr{width:19px;height:19px;border-radius:50%;background:#fff;display:inline-block;
  box-shadow:0 0 7px rgba(255,255,255,.8);animation:ldrPulse .8s ease-in-out infinite}
.cta70 .ldr{width:40px;height:40px;box-shadow:0 0 14px rgba(255,255,255,.8)}
@keyframes ldrPulse{0%,100%{transform:scale(.78);opacity:.75}50%{transform:scale(1);opacity:1}}
button.pend{pointer-events:none;opacity:.85}
/* лок цепочки — подача Миши (волна 13, фрейм 148:10890): карта НЕ гасится и без
   бейджа уровня, кнопка = синяя на 40% с одним замком (без цены) */
.gcard.chained .bLv{display:none}
.gcard.chained .buyb{opacity:.4}
.gcard .buyb .lkic{display:flex;width:20px;height:20px;opacity:.5}
.gcard .buyb .lkic img{width:100%;height:100%}
.gcard .flash{position:absolute;inset:0;background:var(--accdim);opacity:0;pointer-events:none;z-index:3}
.gcard.bought .flash{animation:bf .5s ease}
@keyframes bf{0%{opacity:1}100%{opacity:0}}
.gcard .mark{cursor:pointer;pointer-events:auto;background:#3380FF;color:#fff;border-radius:6px;
  box-shadow:0 0 24px rgba(51,128,255,.31),inset 0 1px 2px rgba(255,255,255,.1);
  font:700 10px var(--f);padding:2px 6px;white-space:nowrap}
/* имба = ведущая карта на всю ширину (hook) */
.gcard.imba{grid-column:1/-1;background:rgba(27,114,237,.3);border:1px solid var(--line);
  border-radius:24px;animation:none;opacity:1}
.gcard.imba .band{height:105px;border-radius:24px 24px 0 0}
.gcard.imba .thh{top:16px;left:16px;right:16px}
.gcard.imba .frow{display:flex;justify-content:space-between;align-items:center;gap:10px}
.gcard.imba .val{color:#fff}
/* LOCKED — по фрейму 2001/сеток: голый замок+текст без пилюли-подложки (аудит 21.08);
   заголовок имбы при этом влезает в одну строку, как в макете */
.lockpill{display:inline-flex;gap:6px;align-items:center;justify-content:center;
  font:700 12px var(--f);color:rgba(255,255,255,.5);flex-shrink:0}
.lockpill img{width:12px;height:12px;opacity:.6}
.hookrow{display:flex;gap:8px;align-items:center;border:1px solid rgba(255,255,255,.2);
  border-radius:12px;padding:12px;margin-top:6px}
.hookrow .hi{width:16px;height:16px;flex-shrink:0;display:flex;opacity:.8}
.hookrow .hi img{width:100%;height:100%}
.hookrow span:not(.hi){font:400 12px var(--f);flex:1;text-align:left;white-space:nowrap}
.hookrow .btnp{height:31px;padding:0 12px;flex-shrink:0}  /* «Установить» 110.5pt по фрейму (аудит-2 B16) */
.devnote{margin:26px 0 10px;text-align:center;color:var(--muted2);font:400 10.5px/1.5 var(--f)}

/* ---------- ВОЙНА ---------- */
.warbar{position:relative;height:46px;border-radius:14px;overflow:hidden;display:flex;
  font:800 15px var(--f);margin-top:14px}
.warbar .b{background:linear-gradient(90deg,#1B72ED,#0F4187);display:flex;align-items:center;padding-left:14px;transition:width .4s}
.warbar .r{background:linear-gradient(90deg,#FF0F4B,#99092D);flex:1;display:flex;align-items:center;justify-content:flex-end;padding-right:14px}
.warcap{display:flex;justify-content:space-between;color:var(--muted);font-size:13px;margin-top:8px}
.warcap b{color:#fff}
.wcard{margin-top:14px;background:var(--panel);border-radius:16px;padding:14px 16px;font-size:14px;color:var(--muted);line-height:1.5}
.wcard b{color:#fff}
.wcard .timer{font:800 26px var(--f);color:#fff;letter-spacing:1px;margin:4px 0}
.wcard button{margin-top:10px;width:100%;border:0;border-radius:14px;padding:14px;

/* ---------- ЗАДАНИЯ (Figma, волна 4) ---------- */
.secrow{display:flex;justify-content:space-between;align-items:baseline;margin:16px 0 10px}
.secrow .st{font:700 14px var(--f)}
.secrow .sn{font:400 11px var(--f);color:var(--muted)}
/* три слота ежедневного комбо (декоративный тизер) */
.comboRow{display:flex;gap:10px}
.cslot{flex:1;height:84px;border-radius:16px;background:#1C76F5;overflow:hidden;

.cslot .cb{height:48px;flex-shrink:0;display:flex;background:rgba(255,255,255,.05)}
.cslot .cb img{width:100%;height:100%;object-fit:cover}
.cslot .cl{flex:1;display:flex;align-items:center;justify-content:center;
  font:400 10px/1.4 var(--f);color:#fff;text-align:center;padding:0 4px}
.cslot.mystery{background:linear-gradient(135deg,#121420,#0B1020);border:1px solid rgba(255,255,255,.1);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.06),inset 0 -1px 0 rgba(0,0,0,.4)}
/* баннер награды комбо (живая кнопка сбора справа) */
.rewardbar{display:flex;align-items:center;gap:8px;background:rgba(11,11,20,.8);
  border:1px solid rgba(255,255,255,.08);border-radius:12px;padding:4px 6px 4px 4px;margin-top:10px}
.rewardbar .aw26{width:26px;height:26px;border-radius:8px;background:rgba(255,215,0,.1);

.rewardbar .aw26 img{width:14px;height:14px}
.rewardbar .rl{font:400 12px var(--f);color:#9A9AB6}
.rewardbar .rv{display:flex;gap:5px;align-items:center;font:800 16px var(--f)}
.rewardbar button{margin-left:auto;height:32px;padding:0 14px;font:700 12px var(--f);

/* миссии «СПЕЦОПЕРАЦИИ» */
.tasks{display:flex;flex-direction:column;gap:12px}
.task{background:linear-gradient(135deg,rgba(255,255,255,.04),transparent);
  border:1px solid #23273F;border-radius:16px;padding:12px;display:flex;gap:12px;align-items:center;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.06)}

.task .tx{flex:1;min-width:0}
.task .tx b{font:500 14px/1.4 var(--f);display:block}

  color:var(--muted);margin-top:3px}
.task .tx .rw2 img,.task .tx .rw2 svg{width:12px;height:12px;flex-shrink:0}
.task .tbtn{width:110px;height:32px;padding:0;font:700 12px var(--f);border-radius:12px;
  flex-shrink:0;color:#fff;text-transform:none}
.task .tst{border:0;background:none;font:700 12px var(--f);flex-shrink:0;padding:0 4px;white-space:nowrap}

/* ---------- ТОП «Рейтинг» (Figma, волна 5) ---------- */
/* свитчер Все / Мой лагерь: пилюля h36, активный сегмент — синяя заливка */
.seg{display:flex;height:36px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);
  border-radius:18px;padding:3px}
.seg button{flex:1;border:1px solid transparent;background:transparent;color:var(--muted);
  font:500 13px var(--f);border-radius:15px;padding:0}
.seg button.on{background:#327FFF;border-color:rgba(255,255,255,.15);color:#fff;font-weight:700}
/* компакт-полоса битвы: только проценты + перетягивание, без сабтекстов */
.tstrip{margin-top:12px;background:var(--panel);border-radius:16px;padding:16px}

.tstrip .nums .kb{color:var(--rkn)} .tstrip .nums .kv{color:var(--vpn)}

.tstrip .tug .b{background:linear-gradient(90deg,#1B72ED,#0F4187)}
.tstrip .tug .r{background:linear-gradient(90deg,#FF0F4B,#99092D);flex:1}
/* строки лидеров: ранг · аватар 32 с лагерным штрихом · ник · чип+счёт */
#lbrows{margin-top:12px}
.rtrow{display:flex;gap:10px;align-items:center;background:var(--card);border:1px solid var(--line);

.rtrow .tn{flex:1;min-width:0;font:700 13px var(--f);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rtrow .tc{display:flex;gap:5px;align-items:center;font:700 13px var(--f);flex-shrink:0}
/* своя строка: закреплена внизу, синий градиент как у главной CTA */
.rtrow.me{background:linear-gradient(135deg,#337FFF,#1C7BFE);border-color:rgba(255,255,255,.15)}
.rtrow.me .rk{color:rgba(255,255,255,.85)}
.rtrow.me .tav{border-color:rgba(255,255,255,.6)}
/* баннер-воронка «Установи ВПН» внизу таба → фейк-стор */
.banner{margin:16px 0 6px;border-radius:16px;padding:12px;cursor:pointer;
  background:#121420;border:1px solid #3380FF;display:flex;gap:10px;align-items:center}
.banner .bt2{min-width:0}
.banner .bt2 b{display:block;font:700 13px var(--f)}

.banner .chev{margin-left:auto;width:20px;height:20px;flex-shrink:0;display:flex}
.banner .chev img{width:100%;height:100%}

/* ---------- ФЕЙК-СТОР — страница App Store (Figma волна 8, СВЕТЛАЯ, SF Pro) ---------- */
.store{position:fixed;top:0;bottom:0;left:0;right:0;margin:0 auto;width:100%;max-width:var(--colw);z-index:110;
  background:#fff;color:#000;display:none;flex-direction:column;position:fixed;
  font-family:-apple-system,'SF Pro Text','SF Pro Display','Segoe UI',Roboto,sans-serif}

.store .scroll{overflow-y:auto;padding:96px 0 110px;flex:1;scrollbar-width:none}
.store .scroll::-webkit-scrollbar{display:none}
.sb-status{position:absolute;top:0;left:0;right:0;height:54px;z-index:6;background:rgba(255,255,255,.85);
  backdrop-filter:blur(14px);display:flex;align-items:flex-end;justify-content:space-between;
  padding:0 28px 6px;font:590 17px inherit;font-weight:590}
.sb-levels{display:flex;gap:7px;align-items:center}
.sb-tool{position:absolute;top:54px;left:0;right:0;z-index:6;display:flex;justify-content:space-between;
  padding:0 16px;background:linear-gradient(180deg,rgba(255,255,255,.85),rgba(255,255,255,0))}
.sb-circle{width:44px;height:44px;border-radius:50%;background:#F2F2F5;border:0;
  display:flex;align-items:center;justify-content:center;color:#404040;font-size:19px;font-weight:510}
.shead{display:flex;gap:16px;align-items:center;padding:10px 20px 20px}

/* ---------- ОНБОРДИНГ ВПН — 4 УТП-слайда (Figma волна 11: 103:16195/16272/16301/16318, макет 390×844) ---------- */
.onb{position:fixed;top:0;bottom:0;left:0;right:0;margin:0 auto;width:100%;max-width:var(--colw);z-index:130;background:#070710;display:none;flex-direction:column;overflow:hidden}
/* запуск как настоящей iOS-прилы (правка Саши 21.08): вырастает из иконки в сторе
   (origin ≈ позиция иконки в шапке App Store), скругление тает до фуллскрина */
.onb.on{display:flex;animation:appLaunch .55s cubic-bezier(.3,.9,.35,1) both;transform-origin:22% 13%}
@keyframes appLaunch{from{transform:scale(.12);opacity:0;border-radius:56px}
  35%{opacity:1}to{transform:none;opacity:1;border-radius:0}}
/* фоновые градиент-панели ОБЩИЕ (в Figma идентичны на всех 4 фреймах) и тянутся ЗА футер
   до низа экрана: y=321→38.03% (r32) и y=441→52.25% (r50) от H=844 */
/* g1: в Figma градиент rgba(27,114,237,.01)→#000 интерполируется ПРЯМОЙ альфой,
   CSS — предумноженной (синие полутона гаснут в серо-чёрный — «градиент криво»,
   замечание Павла 21.08). 11 стопов повторяют фигмовскую кривую */
.onb .g1{position:absolute;left:0;right:0;top:38.03%;bottom:0;border-radius:32px 32px 0 0;
  background:linear-gradient(180deg,
    rgba(27,114,237,.01) 0%, rgba(24,103,213,.109) 10%, rgba(22,91,190,.208) 20%,
    rgba(19,80,166,.307) 30%, rgba(16,68,142,.406) 40%, rgba(14,57,119,.505) 50%,
    rgba(11,46,95,.604) 60%, rgba(8,34,71,.703) 70%, rgba(5,23,47,.802) 80%,
    rgba(3,11,24,.901) 90%, rgba(0,0,0,1) 100%);pointer-events:none}
.onb .g2{position:absolute;left:0;right:0;top:52.25%;bottom:0;border-radius:50px 50px 0 0;
  background:linear-gradient(180deg,rgba(255,255,255,.1),rgba(255,255,255,0));pointer-events:none}
.slides{flex:1;display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;min-height:0;
  position:relative;z-index:1}
.slides::-webkit-scrollbar{display:none}
/* слайд = 390×683 макета (нижние 161px — общий футер); позиции элементов — инлайном
   из CONFIG.onboarding (проценты от Figma-геометрии слайда) */
.slide{flex:0 0 100%;scroll-snap-align:center;position:relative;overflow:hidden;text-align:center}
.slide .heroA{position:absolute}
.slide .heroA img{width:100%;height:auto;display:block}
.slide .deco{position:absolute;opacity:.6}
.slide .deco img{width:100%;height:auto;display:block}
.slide .txt{position:absolute;top:73.65%;left:0;right:0;padding:0 24px}  /* y=503/683 */
.slide h2{font:700 24px/29px var(--f);margin:0;color:#fff;white-space:pre-line}
.slide p{font:400 14px/21px 'Geist',var(--f);color:#fff;margin:16px 0 0}
/* футер: дотсы 12px → 39px → кнопка 70px → 40px до низа (Figma: 683/734/804) */
.onbfoot{flex:none;position:relative;z-index:1;display:flex;flex-direction:column;align-items:stretch;
  gap:39px;padding:0 16px max(40px, calc(16px + env(safe-area-inset-bottom)))}
.dots{display:flex;gap:8px;justify-content:center}
.dots i{width:12px;height:12px;border-radius:4px;background:rgba(255,255,255,.1);
  border:1px solid rgba(255,255,255,.1);backdrop-filter:blur(10px);transition:.2s}
.dots i.on{background:linear-gradient(135deg,#337FFF,#005ADA);border-color:transparent;
  box-shadow:0 6px 14px -4px rgba(51,127,255,.2),inset 0 1px 2px #fff}
.nextbtn{height:70px;width:100%;font-size:16px}

/* ---------- ИНТРО-ОНБОРДИНГ ИГРЫ — ПИКСЕЛЬ-ПЕРФЕКТ по Figma волна 15
   (фреймы 148:8655, 169:13643/13741/13870, 148:8711 — Миша допилил арты 20.08;
   макет 390×844): слайдер ДО выбора стороны.
   Герой слайда = запечённый кроп фрейма (верхние 390×580: сцена/мокапы + начало
   фоновых панелей с их скруглениями); ниже 580px панели продолжаются ЖИВЫМ CSS
   Фон слайда = запечённый фрейм ЦЕЛИКОМ (390×844): сцена/мокапы + панели с их
   градиентами и амбиент-свечением сцены, которое в Figma затекает ниже панелей
   (плоский CSS-градиент его не повторял — шов был виден, Ф-замечание Павла 21.08);
   тексты/кнопки фрейма затёрты интерполяцией при запечке (tools: запечка в
   ref/audit → мастера onb-intro-N-w15). Тексты/точки/кнопки — живые
   (CONFIG.introOnboarding) поверх; ниже y=844 фрейм уходит в чистый #000,
   фон .intro совпадает ---------- */
.intro{position:fixed;top:0;bottom:0;left:0;right:0;margin:0 auto;width:100%;max-width:var(--colw);
  z-index:125;background:#000;display:none;flex-direction:column;overflow:hidden}
.intro.on{display:flex}
/* подложка под футером (зона ниже слайдера): тот же запечённый фрейм, прижат к низу —
   градиентные панели Figma продолжаются под точками/кнопкой без шва; между слайдами
   низ фреймов различим лишь затухающим амбиентом (Δ≤5/255), подложка одна */
.intro .ibg{position:absolute;left:0;right:0;bottom:0;width:100%;height:auto;pointer-events:none}
.islides{flex:1;display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;
  min-height:0;position:relative;z-index:1}
.islides::-webkit-scrollbar{display:none}
.islide{flex:0 0 100%;scroll-snap-align:center;position:relative;overflow:hidden;text-align:center}
.islide .ihero{position:absolute;left:0;top:0;width:100%;height:auto;display:block}
/* заголовок: Figma y583..639 (Unbounded 600 20/28, центр, 2 строки) — прижат к низу
   зоны слайдов (дно текста в макете за 23px до точек) */
.islide h2{position:absolute;left:24px;right:24px;bottom:23px;margin:0;
  font:600 20px/28px var(--f);color:#fff;white-space:pre-line}
/* футер интро: точки y662 → 32px → кнопка 70px → 28px → «Пропустить» → 23px до низа */
.ifoot{flex:none;position:relative;z-index:1;display:flex;flex-direction:column;align-items:stretch;
  padding:0 16px max(23px, calc(10px + env(safe-area-inset-bottom)))}
.ifoot .dots{margin-bottom:32px}
.ifoot .iskip{margin-top:28px;border:0;background:none;padding:0;
  font:700 14px/17px var(--f);color:rgba(255,255,255,.6);text-transform:uppercase}

/* ---------- ПЕРЕХОД ИГРА → СТОР — ПИКСЕЛЬ-ПЕРФЕКТ по Figma волна 13:
   (1) системный «Открыть ссылку?» прямо в игре (фрейм 160:12487, iOS-алерт тёмный);
   (2) Safari с живой страницей apps.apple.com и вопросом «Открыть эту страницу
       в приложении App Store?» (фрейм 148:8598);
   (3) стор въезжает app-switch-анимацией. Тайминги/кривые — CONFIG.transitions ---------- */
.iosdlg{position:fixed;top:0;bottom:0;left:0;right:0;margin:0 auto;width:100%;max-width:var(--colw);
  z-index:108;background:rgba(0,0,0,.7);display:none;align-items:center;justify-content:center;
  font-family:-apple-system,'SF Pro Text','Segoe UI',Roboto,sans-serif}
.iosdlg.on{display:flex;animation:dlgIn .18s ease-out}
@keyframes dlgIn{from{opacity:0}to{opacity:1}}
/* бокс = промеры растра alert-160-12485@3x (298 ди-px шириной): r34-сквиркл, блюр-материал
   ~#1B1C20, заголовок 17 semibold ВЛЕВО (x25), пилюля URL x16 r16 (+белый 9%, высота по
   контенту — наш URL короче эталонного), кнопки РАВНЫЕ 129×48 капсули (r24), зазор 8,
   «Открыть» #3E87F6, «Отмена» +белый 7.5%; перенос URL = overflow-wrap:anywhere как в iOS */
.idbox{width:298px;border-radius:34px;background:rgba(26,27,32,.82);
  -webkit-backdrop-filter:blur(30px) saturate(1.4);backdrop-filter:blur(30px) saturate(1.4);
  padding:22px 16px 15px;color:#fff;animation:dlgPop .22s cubic-bezier(.3,1.4,.6,1) both}
@keyframes dlgPop{from{transform:scale(1.12);opacity:0}to{transform:none;opacity:1}}
.idbox .idt{font-weight:600;font-size:17px;line-height:22px;letter-spacing:-.4px;
  text-align:left;padding:0 9px}
.idbox .idu{margin-top:15px;background:rgba(255,255,255,.09);
  border-radius:16px;padding:6px 10px;display:flex;align-items:center;justify-content:center;
  font-size:16px;line-height:20px;text-align:center;overflow-wrap:anywhere;color:#fff}
.idbox .idbtns{display:flex;gap:8px;margin-top:23px}
.idbox .idbtns button{flex:1;height:48px;border:0;border-radius:24px;color:#fff;
  font-family:inherit;font-weight:600;font-size:17px;line-height:22px;letter-spacing:-.4px}
.idbox .idc{background:rgba(255,255,255,.075)}
.idbox .ido{background:#3E87F6}
.safari{position:fixed;top:0;bottom:0;left:0;right:0;margin:0 auto;width:100%;max-width:var(--colw);
  z-index:109;background:#F7F7F7;display:none;flex-direction:column;color:#000;
  font-family:-apple-system,'SF Pro Text','Segoe UI',Roboto,sans-serif}
.safari.on{display:flex;animation:swAppIn var(--swms) var(--swease) both}
/* хром Safari (фрейм 148:8598, волна 18): статус-бар (9:41 + уровни) и весь нижний бар
   (адресная строка + иконки + тень) = SVG-экспорт слоёв Миши КАК ЕСТЬ — ноль отсебятины */
.saf-status{flex:none}
.saf-status img,.saf-bar img{display:block;width:100%;height:auto}
.saf-page{flex:1;min-height:0;position:relative;overflow:hidden;background:#EFEFF2}
.saf-page .pg{width:100%;height:100%;object-fit:cover;object-position:top}
.saf-dim{position:absolute;inset:0;background:rgba(0,0,0,.15);opacity:0;transition:opacity .25s;pointer-events:none}
.saf-dim.show{opacity:1}
/* системный вопрос Safari (фрейм 148:8598: бокс 343×104 на y310 из 812, #1C1C1E, r20,
   паддинг 16; страница видна y38..684 → верх бокса = (310−38)/646 = 42.1% зоны страницы) */
.saf-dlg{position:absolute;left:16px;right:16px;top:42.1%;background:#1C1C1E;
  border:.5px solid #4F4F4F;border-radius:20px;padding:16px;color:#fff;
  opacity:0;transform:scale(.96);pointer-events:none;transition:.25s}
.saf-dlg.show{opacity:1;transform:none;pointer-events:auto}
.saf-dlg .sdt{font-size:14px;line-height:22px;font-weight:510;letter-spacing:-.4px;max-width:266px}
.saf-dlg .sdb{display:flex;justify-content:flex-end;gap:12px;margin-top:6px}
.saf-dlg button{border:0;background:none;padding:0;color:#0A84FF;font-size:17px;line-height:22px;
  font-family:inherit;letter-spacing:-.4px;font-weight:400}
.saf-dlg button.op{font-weight:590}
.saf-bar{flex:none;position:relative;margin-top:-2px}   /* svg несёт 2px тени бара над его фоном */
.saf-home{position:absolute;left:50%;bottom:8px;transform:translateX(-50%);
  width:134px;height:5px;border-radius:100px;background:#000}
/* стор открывается app-switch-анимацией по «Открыть» в вопросе Safari */
.store.on{animation:swAppIn var(--swms) var(--swease) both}
/* ---------- app-switch переходы (как в iOS: уходящая прила сжимается-уезжает,
   приходящая наезжает; только transform/opacity — без reflow). CONFIG.transitions ---------- */
@keyframes swAppIn{from{transform:translateX(55%) scale(.94);opacity:.3}to{transform:none;opacity:1}}
@keyframes swAppOut{to{transform:translateX(-26%) scale(.9);opacity:0}}
.vapp.on{display:flex;animation:swAppIn var(--swms) var(--swease) both}
.vapp.away{animation:swAppOut var(--swms) var(--swease) both}
body.swin>header,body.swin>main,body.swin>nav{animation:swGameIn var(--swms) var(--swease) both}
@keyframes swGameIn{from{transform:translateX(20%) scale(.96);opacity:.25}to{transform:none;opacity:1}}

/* ---------- ПРИЛОЖЕНИЕ ВПН (Figma волна 8: фреймы 13-15) ---------- */
.vapp{position:fixed;top:0;bottom:0;left:0;right:0;margin:0 auto;width:100%;max-width:var(--colw);z-index:132;
  background:#070712;display:none;flex-direction:column;overflow:hidden}
/* .vapp.on — выше, в блоке app-switch переходов */
.vnav{flex:none;display:flex;align-items:center;justify-content:space-between;padding:16px 24px 0}  /* фрейм 1967: кнопки y16 (аудит-2 A§5: было 12 — весь блок сидел на 12pt выше) */
.vnav .vbtn{width:40px;height:40px;border-radius:12px;background:rgba(255,255,255,.04);
  border:1px solid rgba(255,255,255,.08);display:flex;align-items:center;justify-content:center;padding:0}
.vnav .vbtn img{width:20px;height:20px}
.vnav .vt{font:700 18px var(--f);color:#fff}
.vstatus{flex:none;margin-top:48px;text-align:center;font:900 24px var(--f);color:#fff}  /* фрейм 1967: статус y104 = нав-бар 56 (16+40) + 48 (аудит-2 A§5) */
.vapp.conn .vstatus{color:#10B981}
/* фрейм 1967: кольцо y179 (45 от статуса), подсказка y471 (36 от кольца), слак вниз */
.vherowrap{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;
  justify-content:flex-start;padding-top:45px;gap:36px}
/* кольцо по фрейму 1967: тор = заливка 20% синего (у слоя-двойника с блюром 54 — гало),
   кнопка #0E0F24 с белой градиент-обводкой 22% (5.4px) и синей тенью 40/6.7 */
.vring{width:256px;height:256px;aspect-ratio:1;border-radius:50%;flex-shrink:1;
  background:rgba(51,128,255,.2);border:1.35px solid rgba(255,255,255,.08);
  box-shadow:0 0 54px 0 rgba(51,128,255,.1);   /* гало едва заметное, как LAYER_BLUR фрейма (аудит-2 A§5: .25/8px светил втрое ярче) */
  display:flex;align-items:center;justify-content:center;cursor:pointer}
.vpower{width:84.4%;height:84.4%;border-radius:50%;
  background:linear-gradient(#0E0F24,#0E0F24) padding-box,
    linear-gradient(135deg,rgba(255,255,255,.22),rgba(255,255,255,0) 60%) border-box;
  border:5.4px solid transparent;box-shadow:0 0 40.4px 6.7px rgba(51,128,255,.2);
  display:flex;align-items:center;justify-content:center}
.vpower img{width:65px;height:65px;opacity:.92}
.vapp.conn .vring{background:rgba(16,185,129,.2);box-shadow:0 0 60px 8px rgba(16,185,129,.22)}
/* вкл-кнопка по фрейму (аудит-2 A§6): мятная кромка над своей заливкой + зелёное ГАЛО
   вокруг кнопки; «игровых губ» 0±4px во фрейме нет */
.vapp.conn .vpower{background:linear-gradient(135deg,#10B981,#06A671) padding-box,
  var(--edgeV) border-box,var(--edgeH) border-box,
  linear-gradient(135deg,#10B981,#06A671) border-box;
  border:2px solid transparent;
  box-shadow:0 0 56px 14px rgba(16,185,129,.5),inset 0 9px 6.5px rgba(255,255,255,.25)}
.vhint{font:400 13px var(--f);color:var(--muted);text-align:center}
.vread{flex:none;width:342px;max-width:calc(100% - 48px);margin:0 auto;   /* фрейм: y535, слак герой-зоны */
  display:flex;flex-direction:column;gap:12px}
.vcard{display:flex;align-items:center;justify-content:space-between;gap:10px;
  border:1px solid var(--line);border-radius:16px;padding:16px}
.vcard .l{display:flex;align-items:center;gap:12px;min-width:0}
.vcard .l img{width:20px;height:20px}
.vcard .ll{font:500 14px var(--f);color:var(--muted)}
.vcard .lv{font:700 14px var(--f);color:#fff;white-space:nowrap}
.vspeed{display:flex;gap:12px}
.vs1{flex:1;display:flex;align-items:center;gap:10px;border:1px solid var(--line);
  border-radius:16px;padding:16px;min-width:0}
.vs1 .circ{width:28px;height:28px;border-radius:14px;display:flex;align-items:center;
  justify-content:center;flex-shrink:0}
.vs1 .circ img{width:14px;height:14px}
.vs1 .circ.g{background:rgba(16,185,129,.1)}
.vs1 .circ.r{background:rgba(239,68,68,.1)}
.vs1 .col{display:flex;flex-direction:column;gap:2px;min-width:0}
.vs1 .sl{font:400 12px var(--f);color:var(--muted)}
.vs1 .sv{font:700 14px var(--f);color:#fff;white-space:nowrap}
.vdrawer{flex:none;width:342px;max-width:calc(100% - 48px);   /* фрейм: сервер y733 (зазор 68), до низа 43 */
  margin:68px auto max(43px, calc(20px + env(safe-area-inset-bottom)))}
.vserver{display:flex;align-items:center;justify-content:space-between;gap:10px;
  background:rgba(255,255,255,.1);border-radius:16px;padding:16px;cursor:default}
.vserver .l{display:flex;align-items:center;gap:12px}
.vserver .fl{font:400 20px -apple-system,sans-serif}
.vserver .cn{font:500 14px var(--f);color:#fff}

/* цена следующей покупки карты на уровне lv (0 = ещё не куплена): база×1.5^lv; имба — от imbaUpBase */
const upPrice = (c, lv) => Math.round((c.imba ? L.imbaUpBase * Math.pow(L.priceMult, lv - 1)
                                              : c.price * Math.pow(L.priceMult, lv)));
const tpl = (s, vars) => s.replace(/\{(\w+)\}/g, (_, k) => (vars && k in vars) ? vars[k] : '{' + k + '}');
const fmt = n => {
  n = Math.floor(n);
  if (n >= 1e9) return (n/1e9).toFixed(2).replace('.', ',') + ' млрд';
  if (n >= 1e6) return (n/1e6).toFixed(2).replace('.', ',') + ' млн';
  if (n >= 1e4) return Math.floor(n/1e3).toLocaleString('ru-RU') + ' К';
  return n.toLocaleString('ru-RU');
};
/* формат счёта в «Рейтинге» (макет Миши): миллионы → «98.2M», меньше — обычный fmt */
const fmtM = n => n >= 1e6 ? (n/1e6).toFixed(1) + 'M' : fmt(n);
/* MM:SS для бейджа буста/перезарядки шифра (волна 21) */
const mmss = ms => { const s = Math.max(0, Math.ceil(ms/1000));
  return String(Math.floor(s/60)).padStart(2,'0') + ':' + String(s%60).padStart(2,'0'); };

function pph(){
  let t = 0;
  for (const side of ['rkn','vpn'])
    CONFIG.cards[side].forEach((c,i)=>{ if (!c.imba && S.owned[side][i]) t += c.pph * S.owned[side][i]; });
  if (S.vpnInstalled && S.side){
    const c = CONFIG.cards[S.side].find(x=>x.imba);
    if (c) t += c.pph * S.imbaLvl;   // имба считается один раз (открыта в обоих лагерях)
  }
  return t;
}
/* буст дохода от «взлома шифра» (волна 21): множитель ко ВСЕМ байтам (тап + пассив); протух → 1 */
function boostMult(){ return (S.boost && Date.now() < S.boost.until) ? S.boost.mult : 1; }

function paint(){
  $('bytes').textContent = fmt(S.bytes);
  $('pph').textContent = '+' + fmt(pph());

  $('enbar').style.width = (100*S.en/E.energyMax) + '%';

    /* аватар шапки = персонаж команды (Figma волна 9) */
    $('pava').innerHTML = art('avatar_' + S.side) || art('avatar');
    $('tapArt').innerHTML = art('tap_' + S.side);
    $('taphint').innerHTML = tpl(CONFIG.camps[S.side].taphint, {tap:TAP_VAL, mult:E.campMult});
    $('pteam').textContent = CONFIG.camps[S.side].team;
    $('campContrib').textContent = CONFIG.war[S.side + 'Total'];
    $('warContrib').textContent = CONFIG.war[S.side + 'Total'];
  }
  $('myWeight').textContent = fmt(S.taps * TAP_VAL);
  $('codechip').classList.toggle('show', S.storeVisited && !S.vpnInstalled);
  paintAfford();   // волна 16: авто-подсветка кнопок покупки при каждом изменении баланса
}

/* тап по профилю в шапке = смена стороны (пункт «можно сменить сторону позже») */
function toggleSide(){
  if (!S.side) return;
  switchSide(S.side === 'vpn' ? 'rkn' : 'vpn');
}

/* лок цепочки (правка Саши 21.08): карта i доступна, когда предыдущая по списку качнута
   до уровня ≥1 (i=0 всегда открыта; имба вне цепочки — у неё свой ВПН-разлок) */
function chainLocked(i){
  if (!L.chainLock || i === 0) return false;
  if (CONFIG.cards[S.side][i].imba) return false;
  return !((S.owned[S.side][i-1] || 0) > 0);
}

/* фейк-запрос на сервер при прокачке (правка Саши 21.08, как в Хомяке): кнопка →
   лоадер-спиннер на buyDelayMs → реальная покупка. Даблтапы глушатся флагом. */
let buying = false;
/* нехватка байтов на СЛЕДУЮЩУЮ покупку карты i (класс .poor). Локи — не про деньги:
   локнутая имба (крючок), цепочка и MAX класс не получают и от баланса не зависят */
function cardPoor(i){
  const c = CONFIG.cards[S.side][i];
  if (c.imba && !S.vpnInstalled) return false;
  const lv = c.imba ? S.imbaLvl : (S.owned[S.side][i] || 0);
  if (lv >= L.maxLvl) return false;
  if (!c.imba && chainLocked(i)) return false;
  return S.bytes < upPrice(c, lv);
}

/* живая доступность покупок (правка Павла, волна 16): пассивка натикала выше цены —
   кнопка сама «зажигается» (и гаснет обратно после траты). Дёргается из paint() каждым
   тиком/тапом; трогает ТОЛЬКО класс .poor у видимых карт и кнопки шита — без ре-рендера */
function paintAfford(){
  if (!S.side) return;
  for (const el of $('grid').children){
    if (el.dataset.i === undefined) continue;
    /* стороны с 22.08 разной длины: при смене стороны в сетке мгновение живут
       индексы прежней — гард, пока paintCards не перерисовал */
    if (!CONFIG.cards[S.side][+el.dataset.i]) continue;
    el.classList.toggle('poor', cardPoor(+el.dataset.i));
  }
  const pb = $('popBuy');
  if (pb && popCtx && !pb.classList.contains('pend'))
    pb.classList.toggle('poor', cardPoor(popCtx.i));
}

function netBuy(btn, apply){
  if (buying) return;
  buying = true;
  if (btn){
    btn.classList.add('pend');
    btn.innerHTML = '<span class="ldr"></span>';
  }
  setTimeout(()=>{ buying = false; apply(); }, E.buyDelayMs);
}

function paintCards(){
  const g = $('grid'); g.innerHTML = '';
  // FTUE: подсветить самую дешёвую доступную карту (лок цепочки уважаем)
  let tutIdx = -1;
  if (S.tut.active){
    let best = Infinity;
    CONFIG.cards[S.side].forEach((c,i)=>{
      if (!c.imba && !S.owned[S.side][i] && !chainLocked(i) && c.price < best){ best = c.price; tutIdx = i; }
    });
  }
  // рендер по макету Миши: имба — ведущая карта на всю ширину СВЕРХУ, дальше сетка 2 колонки
  const pool = CONFIG.cards[S.side].map((c,i)=>({c,i}));
  pool.sort((a,b)=>(b.c.imba?1:0)-(a.c.imba?1:0));   // имба вперёд; логика buy(i) — по исходному индексу
  const lvlBadge = lv => '<div class="bLv">' + tpl(T.lvlLabel,{lvl:lv, max:L.maxLvl}) + '</div>';
  pool.forEach(({c,i})=>{
    // лестница: уровень карты живёт в S.owned (число), имбы — в S.imbaLvl
    const lv = c.imba ? (S.vpnInstalled ? S.imbaLvl : 0) : (S.owned[S.side][i] || 0);
    const owned = lv > 0;
    const el = document.createElement('div');
    let cls = 'gcard', body = '';
    if (i === tutIdx) cls += ' tuthl';
    // доход на текущем уровне (не куплена — что даст уровень 1)
    const val = '<div class="val">' + chipIc() + '+' + fmt(c.pph * Math.max(1, lv)) + '<span class="ph">/час</span></div>';
    if (c.imba){
      cls += ' imba';
      const locked = !S.vpnInstalled;
      /* локнутая имба (волна 13, фрейм 148:10890): вместо живого дохода — партнёрская
         подача «х2 доход в час» + «При использовании сервиса партнёра» */
      const imbaVal = locked
        ? '<div class="val" style="font:700 12px \'Geist\',var(--f)">' + chipIc() +
          T.imbaX2Line.replace(' ', ' <span class="ph">') + '</span></div>' +   /* «доход в час» приглушён, «х2» белый (аудит-2 B15) */
          '<div class="note">' + T.imbaX2Note + '</div>'
        : val;
      body =
        '<div class="frow"><div class="nm">' + c.nm + '</div>' +
        (locked
          ? '<span class="lockpill">' + art('lock') + T.lockedLabel + '</span>'
          : '<span class="lockpill" style="color:var(--acc2)">' + T.imbaOwnLabel + '</span>') +
        '</div>' +
        imbaVal +
        (locked
          ? '<div class="hookrow"><span class="hi">' + art('lock_gold') + '</span>' +
            '<span>' + T.imbaHookText + '</span><button class="btnp sm">' + T.imbaHookBtn + '</button></div>'
          : (lv >= L.maxLvl
              ? '<div class="own">' + T.maxLabel + '</div>'
              : '<button class="buyb btnp sm">' + chipIc() + fmt(upPrice(c, lv)) + '</button>'));
    } else if (lv >= L.maxLvl){
      cls += ' owned';
      body = '<div class="nm">' + c.nm + '</div>' + val +
        '<div class="own">' + T.maxLabel + '</div>';
    } else if (chainLocked(i)){
      // лок цепочки — подача Миши (волна 13): синяя кнопка на 40% с одним замком
      cls += ' chained';
      body = '<div class="nm">' + c.nm + '</div>' + val +
        '<button class="buyb btnp sm"><span class="lkic">' + art('lock') + '</span></button>';
    } else {
      if (owned) cls += ' owned';
      body = '<div class="nm">' + c.nm + '</div>' + val +
        '<button class="buyb btnp sm">' + chipIc() + fmt(upPrice(c, lv)) + '</button>';
    }
    if (c.marked && !owned) cls += ' marked';
    if (cardPoor(i)) cls += ' poor';   // волна 16: единый расчёт доступности (и у имбы)
    el.dataset.i = i;                  // якорь для живого paintAfford()
    el.className = cls;
    el.innerHTML =
      '<div class="flash"></div>' +
      '<div class="band">' + art(c.art) + '</div>' +
      /* строка бейджей тумбы (волна 13): Ур.N → метка ×2 → ЛЕГЕНДАРНАЯ у правого края */
      '<div class="thh">' + lvlBadge(lv) +
      (c.marked && !owned ? '<div class="mark">' + CONFIG.camps[S.side].mark + '</div>' : '') +
      (c.imba && !S.vpnInstalled ? '<div class="bLeg">' + T.imbaBadge + '</div>' : '') +
      '</div>' +
      '<div class="gbody">' + body + '</div>';
    if (c.marked && !owned)
      el.querySelector('.mark').onclick = e => { e.stopPropagation(); openStore('mark'); };
    /* волна 9: тап по карте = всплывашка; кнопка «улучшить» = прямая покупка без шита.
       21.08: успешная покупка идёт через лоадер «запрос на сервер» (netBuy); нехватка
       байтов и прочие отказы остаются мгновенными (wobble/тост без фейк-запроса) */
    const bb = el.querySelector('.buyb');
    if (bb) bb.onclick = e => {
      e.stopPropagation();
      if (chainLocked(i) && !c.imba){ openCardPop(i, el); return; }   // замок → залоченный шит (фрейм 151:11340)
      if (c.imba){
        S.imbaTouched = true;
        if (S.imbaLvl < L.maxLvl && S.bytes >= upPrice(c, S.imbaLvl)) netBuy(bb, ()=>buyImba(el));
        else buyImba(el);
      } else {
        const lv = S.owned[S.side][i] || 0;
        if (lv < L.maxLvl && S.bytes >= upPrice(c, lv)) netBuy(bb, ()=>buy(i, el));
        else buy(i, el);
      }
    };
    el.onclick = ()=>{
      if (c.imba){
        S.imbaTouched = true;   // idle-событие (волна 10): имбу потрогали — оффер не показываем
        if (S.vpnInstalled){ openCardPop(i, el); return; }   // разлочена — шит с апгрейдом
        if (S.storeVisited){ S.funnelSource = 'card'; openCode(); }   // тап по имбе = вход «за карту»
        else openStore('imba');
        return;
      }
      openCardPop(i, el);   // залоченная цепочкой тоже открывает шит — в залоченном виде (фрейм 151:11340)
    };
    g.appendChild(el);
  });
}

function buy(i, el){
  const c = CONFIG.cards[S.side][i];
  const lv = S.owned[S.side][i] || 0;
  if (chainLocked(i)){                              // лок цепочки (правка Саши 21.08)
    if (el){ el.classList.remove('wob'); void el.offsetWidth; el.classList.add('wob'); }
    toast(T.chainToast);
    return false;
  }
  if (lv >= L.maxLvl) return;                       // потолок лестницы: дальше некуда
  const pr = upPrice(c, lv);
  if (S.bytes < pr){
    el.classList.remove('wob'); void el.offsetWidth; el.classList.add('wob');
    toast(T.poorToast);
    return false;
  }
  S.bytes -= pr;
  S.owned[S.side][i] = lv + 1;                      // покупка = +1 уровень (1-я покупка = уровень 1)
  el.classList.add('bought');
  toast(lv ? tpl(T.upToast, {card:c.nm, lvl:lv+1, max:L.maxLvl, pph:fmt(c.pph)})
           : tpl(T.buyToast, {card:c.nm, pph:fmt(c.pph)}));
  if (S.tut.active) tutEnd();   // FTUE: первая покупка = цель обучения (похвала перекроет тост)
  paint(); paintCards();
  return true;
}

/* апгрейд имбы после разлока: та же лестница, база цены — E.ladder.imbaUpBase (разлок = уровень 1) */
function buyImba(el){
  if (S.imbaLvl >= L.maxLvl) return false;
  const c = CONFIG.cards[S.side].find(x=>x.imba);
  const pr = upPrice(c, S.imbaLvl);
  if (S.bytes < pr){
    el.classList.remove('wob'); void el.offsetWidth; el.classList.add('wob');
    toast(T.poorToast);
    return false;
  }
  S.bytes -= pr;
  S.imbaLvl++;
  el.classList.add('bought');
  toast(tpl(T.upToast, {card:c.nm, lvl:S.imbaLvl, max:L.maxLvl, pph:fmt(c.pph)}));
  paint(); paintCards();
  return true;
}

/* ---- всплывашка карточки (Figma волна 9): арт + описание + уровень/доход + улучшение ---- */
let popCtx = null;   // {i, el} открытой карты (el — элемент сетки, для анимаций покупки)
function openCardPop(i, el){
  const c = CONFIG.cards[S.side][i];
  const CP = CONFIG.cardPopup;
  const lv = c.imba ? S.imbaLvl : (S.owned[S.side][i] || 0);
  const maxed = lv >= L.maxLvl;
  const chained = !c.imba && chainLocked(i);   // залоченный вид шита (волна 13, фрейм 151:11340)
  const pr = maxed ? 0 : upPrice(c, lv);
  popCtx = {i, el};
  const m = $('cardM');
  m.classList.add('bot');
  m.innerHTML =
    '<div class="bsheet cardpop"><div class="dragpill"></div>' +
    '<button class="shx" onclick="closeM(\'cardM\')">' + art('xclose') + '</button>' +
    '<div class="cthumb">' + art(c.art) + '</div>' +
    '<div class="ct">' + c.nm + '</div>' +
    '<div class="cd">' + (c.ds || '') + '</div>' +
    '<div class="cpills">' +
      (chained ? '' : '<span class="cpill">' + tpl(CP.lvlLabel, {lvl:lv}) + '</span>') +
      '<span class="cpill">' + chipIc() + tpl(CP.gainLabel, {pph:fmt(c.pph)}) + '</span></div>' +
    (chained
      ? '<div class="cta70 btnp chainlk">' + art('lock') + '<span>' + CP.chainLine + '</span></div>'
      : maxed
        ? '<div class="cmax">' + CP.maxLabel + '</div>'
        : '<button class="cta70 btnp' + (S.bytes < pr ? ' poor' : '') + '" id="popBuy">' +
          CP.buyLabel + ' ' + chipIc() + fmt(pr) + '</button>') +
    '</div>';
  if (!maxed && !chained) $('popBuy').onclick = popBuy;
  m.onclick = e => { if (e.target === m) closeM('cardM'); };   // тап по подложке = закрыть
  m.classList.add('on');
}
function popBuy(){
  const {i, el} = popCtx || {};
  const c = CONFIG.cards[S.side][i];
  const done = ()=>{
    const ok = c.imba ? buyImba(el) : buy(i, el);
    if (ok) closeM('cardM');          // успех — вернуться к сетке (вспышка покупки на карте)
    else openCardPop(i, el);          // не хватило — перерисовать шит (кнопка в poor)
  };
  const lv = c.imba ? S.imbaLvl : (S.owned[S.side][i] || 0);
  // 21.08: платёжеспособная покупка — через лоадер «запрос на сервер»; отказ — мгновенно
  if (lv < L.maxLvl && S.bytes >= upPrice(c, lv)) netBuy($('popBuy'), done);
  else done();
}

function paintTasks(){
  const TK = CONFIG.tasks;
  $('comboBtn').disabled = S.comboDone;
  $('comboBtn').textContent = S.comboDone ? TK.comboDone : '+' + fmt(E.comboReward);
  /* 4-статусная кнопка (волна 8): go «Перейти» → avail «Проверить» → checking → done */
  $('tasks').innerHTML = TK.list.map(t=>{
    const st = S.tasks[t.k] || 'go';
    const btn =
      st==='go'       ? '<button class="tbtn btnp sm" onclick="taskGo(\'' + t.k + '\')">' + TK.btnGo + '</button>' :
      st==='avail'    ? '<button class="tbtn btnp sm" onclick="checkTask(\'' + t.k + '\')">' + TK.btnAvail + '</button>' :
      st==='checking' ? '<button class="tst chk" disabled>' + TK.btnChecking + '</button>' :
                        '<button class="tst don" disabled>' + TK.btnDone + '</button>';
    return '<div class="task ' + (st==='go'||st==='avail'?'':st) + '">' +
      '<div class="tico">' + art(t.tic || '') + '</div>' +
      '<div class="tx"><b>' + t.nm + '</b>' +
      '<span class="rw2">' + art('lock_blue') + t.rw + '</span></div>' + btn + '</div>';
  }).join('');
}
/* «Перейти» = симуляция ухода в соцсеть (в демо — смена статуса; линк-заглушка допустима) */
function taskGo(k){
  if ((S.tasks[k] || 'go') !== 'go') return;
  S.tasks[k] = 'avail'; paintTasks();
}
function checkTask(k){
  if (S.tasks[k] !== 'avail') return;
  S.tasks[k] = 'checking'; paintTasks();
  setTimeout(()=>{
    S.tasks[k] = 'done'; paintTasks();
    const t = CONFIG.tasks.list.find(x=>x.k===k);
    toast(tpl(CONFIG.tasks.doneToast, {rw:t.rw}));   // начисление — прежний хук-тост
  }, CONFIG.tasks.checkMs);
}
function claimCombo(){
  if (S.comboDone) return;
  S.comboDone = true; S.bytes += E.comboReward;
  paint(); paintTasks();
  toast(tpl(T.comboToast, {n:fmt(E.comboReward)}));
}

/* «Рейтинг»: лидеры + своя строка, ЗАКРЕПЛЁННАЯ внизу (ранг из CONFIG, не по сортировке).
   «Мой лагерь» — клиентский фильтр по стороне игрока, ранги пересчитываются 1..N */
function paintTop(){
  $('lb_all').classList.toggle('on', S.lbTab==='all');
  $('lb_camp').classList.toggle('on', S.lbTab==='camp');
  const LB = CONFIG.leaderboard;
  let rows = LB.entries.slice().sort((a,b)=>b.b-a.b);
  if (S.lbTab==='camp') rows = rows.filter(r=>r.side===S.side);
  const row = (r, rk, me) =>
    '<div class="rtrow ' + r.side + (me?' me':'') + '"><span class="rk">' + rk + '</span>' +
    '<span class="tav">' + art(r.ava) + '</span>' +
    '<span class="tn">' + r.nick + '</span>' +
    '<span class="tc">' + chipIc() + fmtM(r.b) + '</span></div>';
  const myB = S.taps * TAP_VAL || LB.meFallback;   // живой вклад в войну; до первого тапа — мок
  $('lbrows').innerHTML =
    rows.map((r,i)=>row(r, i+1)).join('') +
    row({side:S.side||'vpn', ava:'rt_me', nick:CONFIG.player.name, b:myB}, LB.meRank, true);
}
function lbTab(t){ S.lbTab = t; paintTop(); }
function mgShake(el){ el.classList.remove('wob'); void el.offsetWidth; el.classList.add('wob'); }

/* ---- FTUE-обучение (тексты и числа — CONFIG.tutorial) ----
   Шаги: tap (5 бустованных тапов) → nav (палец на «Карты») → buy (подсветка
   дешёвой карты) → конец на первой покупке. Скип доступен всегда. */
const TUT = CONFIG.tutorial;
function tutStart(){
  if (!TUT.enabled) return;
  S.tut.active = true; S.tut.taps = 0;
  $('coach').classList.remove('off');
  tutStep('tap');
}
function tutStep(step){ S.tut.step = step; if (step==='buy') paintCards(); tutPaint(); }
function tutPaint(){
  if (!S.tut.active) return;
  const txt = $('coachTxt');
  let target = null;
  if (S.tut.step === 'tap'){
    txt.innerHTML = tpl(TUT.tapText,{goal:TUT.tapGoal}) +
      '<span class="cnt">' + tpl(TUT.counter,{done:S.tut.taps, goal:TUT.tapGoal}) + '</span>';
    target = $('tapzone');
  } else if (S.tut.step === 'nav'){
    txt.textContent = TUT.buyText;
    target = document.querySelector('nav button[data-v="v-cards"]');
  } else if (S.tut.step === 'buy'){
    txt.textContent = TUT.buyText;
    target = document.querySelector('.gcard.tuthl');
  }
  tutPoint(target);
}
/* сцена (волна 19): fixed-слои живут в дизайн-координатах стейджа 390×844, а
   getBoundingClientRect/clientX отдают вьюпорт-пиксели — переводим через рект сцены */
const stageScale = () => document.getElementById('stage').getBoundingClientRect().width / 390;
function stageRectOf(el){
  const s = document.getElementById('stage').getBoundingClientRect(), k = s.width / 390;
  const r = el.getBoundingClientRect();
  return {left:(r.left - s.left) / k, top:(r.top - s.top) / k, width:r.width / k, height:r.height / k};
}
function tutPoint(el){
  const ptr = $('coachPtr'), txt = $('coachTxt');
  if (!el || !el.offsetParent){ ptr.style.display='none'; txt.style.display='none'; return; }
  ptr.style.display=''; txt.style.display='';
  const r = stageRectOf(el), cx = r.left + r.width/2;   // дизайн-координаты сцены
  ptr.style.left = (cx - 22) + 'px';
  ptr.style.top  = Math.max(8, r.top - 58) + 'px';
  const tw = txt.offsetWidth || 200;
  txt.style.left = Math.max(10, Math.min(cx - tw/2, 390 - tw - 10)) + 'px';
  txt.style.top  = Math.max(8, r.top - 66 - (txt.offsetHeight || 40)) + 'px';
}
function tutEnd(){          // цель достигнута: короткая похвала и всё
  S.tut.active = false; S.tut.step = null;
  $('coach').classList.add('off');
  toast(TUT.praiseToast);
}
function tutSkip(){         // «Пропустить» — молча убрать коуча и подсветку
  S.tut.active = false; S.tut.step = null;
  $('coach').classList.add('off');
  if (S.side) paintCards();
}

/* ---- играбельные мини-игры (числа и тексты — CONFIG.minigames) ----
   Капча — разовая награда; шифр (волна 21) — временный буст дохода вместо байтов.
   Потолок выгоды воронку не шорткатит. */
const MG = CONFIG.minigames;
let mgRun = null;   // живая сессия: {kind, round, streak, zone, pos, raf, timer, over…}
function mgStopTimers(){
  if (!mgRun) return;
  if (mgRun.raf) cancelAnimationFrame(mgRun.raf);
  if (mgRun.timer) clearInterval(mgRun.timer);
  mgRun.raf = mgRun.timer = null;
}
function mgOpen(kind){
  mgStopTimers();
  mgRun = {kind, round:1, streak:0, over:false};
  const C = MG[kind], tx = C.texts[S.side];
  const vars = kind === 'cipher' ? {min:C.minStreak, mins:C.boostMins}
                                 : {good:C.goodCount, sec:C.timerSec, rounds:C.rounds};
  $('mgview').innerHTML =
    '<div class="mgbar"><b>' + tx.title + '</b><button class="x" onclick="mgClose()">✕</button></div>' +
    '<div class="mgsub">' + tpl(tx.sub, vars) + '</div>' +
    '<div class="mgstage" id="mgstage"></div>';
  $('mgview').classList.add('on');
  if (kind === 'cipher'){ if (cipherCdLeft() > 0) cipherCooldown(); else cipherRound(); }
  else capRound();
}
function mgClose(){
  mgStopTimers();
  mgRun = null;
  $('mgview').classList.remove('on');
}
/* победный экран капчи (разовая награда); у шифра свой финал — cipherGrant() */
function mgWin(kind){
  mgStopTimers();
  mgRun.over = true;
  const C = MG[kind], tx = C.texts[S.side];
  const first = !S.mgWon[kind];
  if (first){ S.mgWon[kind] = true; S.bytes += C.reward; paint(); }
  $('mgstage').innerHTML =
    '<div class="mgwin"><div class="big">' + art(MG.list.find(m=>m.game===kind).art) + '</div>' +
    '<h3>' + C.winTitle + '</h3>' +
    '<p>' + (first ? '+' + fmt(C.reward) + ' байтов' : MG.rewardOnceLine) + '</p>' +
    '<button class="mgbtn" onclick="mgClose()">' + MG.winBack + '</button></div>';
  if (first) toast(tpl(MG.winToast, {game:tx.title, n:fmt(C.reward)}));
}

/* «взлом шифра» (волна 21): серия попаданий без промаха — с каждым хитом зона уже
   и метка быстрее. Серия ≥ minStreak → буст дохода ×(серия−1): забрать кнопкой или
   играть до промаха (набранное не сгорает). Короткая серия не считается и играется сразу. */
function cipherCdLeft(){ return Math.max(0, S.cipherCdUntil - Date.now()); }
function cipherRound(){
  const C = MG.cipher;
  const zonePct = Math.max(C.zoneMinPct, C.zoneStartPct - C.zoneShrinkPct*mgRun.streak);
  const zoneLeft = 8 + Math.random()*(84 - zonePct);   // не прижимать к краям
  mgRun.zone = [zoneLeft, zoneLeft + zonePct];
  mgRun.pos = 0;
  $('mgstage').innerHTML =
    '<div class="mground">' + tpl(C.roundLabel,{n:mgRun.streak}) + '</div>' +
    '<div class="tbar"><div class="tzone" style="left:' + zoneLeft + '%;width:' + zonePct + '%"></div>' +
    '<div class="tmark" id="tmark" style="left:0%"></div></div>' +
    '<button class="mgbtn" onclick="cipherStop()">' + C.stopLabel + '</button>' +
    (mgRun.streak >= C.minStreak
      ? '<button class="mgbtn bank" onclick="cipherBank()">' + tpl(C.bankLabel,{mult:mgRun.streak-1}) + '</button>' : '');
  mgRun.t0 = performance.now();
  mgRun.sweepMs = C.sweepSec * Math.pow(C.speedUpFactor, mgRun.streak) * 1000;
  const loop = now => {
    if (!mgRun || mgRun.kind !== 'cipher' || mgRun.over) return;
    const ph = ((now - mgRun.t0) / mgRun.sweepMs) % 2;
    mgRun.pos = ph < 1 ? ph : 2 - ph;                   // 0..1 пинг-понг
    const el = $('tmark'); if (el) el.style.left = (mgRun.pos*100) + '%';
    mgRun.raf = requestAnimationFrame(loop);
  };
  mgRun.raf = requestAnimationFrame(loop);
}
function cipherStop(){
  if (!mgRun || mgRun.kind !== 'cipher' || mgRun.over) return;
  cancelAnimationFrame(mgRun.raf);
  const C = MG.cipher, pct = (mgRun.pos || 0) * 100;
  if (pct >= mgRun.zone[0] && pct <= mgRun.zone[1]){
    mgRun.streak++;
    cipherRound();                                    // серия живёт: дальше или «Забрать ×N»
  } else if (mgRun.streak >= C.minStreak){
    cipherGrant();                                    // промах, но серия набрана — буст не сгорает
  } else {
    toast(tpl(C.missToast,{min:C.minStreak}));
    mgRun.streak = 0;                                 // не засчитано: без буста и без перезарядки
    cipherRound();
  }
}
function cipherBank(){
  if (!mgRun || mgRun.kind !== 'cipher' || mgRun.over) return;
  cancelAnimationFrame(mgRun.raf);
  cipherGrant();
}
/* выдача буста: доход ×(серия−1) на boostMins минут + перезарядка игры на cooldownMins */
function cipherGrant(){
  mgStopTimers();
  mgRun.over = true;
  const C = MG.cipher, mult = mgRun.streak - 1;
  S.boost = {mult, until: Date.now() + C.boostMins*60e3};
  S.cipherCdUntil = Date.now() + C.cooldownMins*60e3;
  $('mgstage').innerHTML =
    '<div class="mgwin"><div class="big">' + art('game_cipher') + '</div>' +
    '<h3>' + C.winTitle + '</h3>' +
    '<p>' + tpl(C.winLine,{mult, mins:C.boostMins}) + '<br>' + tpl(C.winCdLine,{cd:C.cooldownMins}) + '</p>' +
    '<button class="mgbtn" onclick="mgClose()">' + MG.winBack + '</button></div>';
  toast(tpl(C.boostToast,{n:mgRun.streak, mult, mins:C.boostMins}));
  paintCipherBadge();
}
/* экран перезарядки: открыли шифр во время кулдауна — играть нельзя, таймер тикает */
function cipherCooldown(){
  const C = MG.cipher;
  mgRun.over = true;
  $('mgstage').innerHTML =
    '<div class="mgwin"><div class="big">' + art('game_cipher') + '</div>' +
    '<h3>' + C.cdTitle + '</h3>' +
    '<p>' + C.cdLine + ' <b id="cdleft">' + mmss(cipherCdLeft()) + '</b></p>' +
    '<button class="mgbtn" onclick="mgClose()">' + MG.winBack + '</button></div>';
  mgRun.timer = setInterval(()=>{
    const el = $('cdleft'); if (el) el.textContent = mmss(cipherCdLeft());
  }, 500);
}
/* бейдж плитки шифра на экране игр: «×N MM:SS» при бусте, «перезарядка MM:SS» при кулдауне */
function paintCipherBadge(){
  const el = $('cipherBadge'); if (!el) return;
  const C = MG.cipher;
  if (boostMult() > 1){
    el.style.display = ''; el.classList.remove('cd');
    el.textContent = tpl(C.badgeBoost,{mult:S.boost.mult, t:mmss(S.boost.until - Date.now())});
  } else if (cipherCdLeft() > 0){
    el.style.display = ''; el.classList.add('cd');
    el.textContent = tpl(C.badgeCd,{t:mmss(cipherCdLeft())});
  } else el.style.display = 'none';
}

/* «обход капчи»: cols×cols (волна 21: 6×6), найди все правильные плитки до конца
   таймера; ошибка или таймаут — с первого раунда. Размер сетки — CONFIG, не хардкод. */
function capRound(){
  const C = MG.captcha, tx = C.texts[S.side];
  const cellN = C.cols * C.cols;
  const good = new Set();
  while (good.size < C.goodCount) good.add(Math.floor(Math.random()*cellN));
  mgRun.good = good; mgRun.found = 0;
  let cells = '';
  for (let i = 0; i < cellN; i++)
    cells += '<div class="capcell" data-i="' + i + '" onclick="capTap(' + i + ')">' +
      art(good.has(i) ? tx.goodArt : tx.badArt) + '</div>';
  $('mgstage').innerHTML =
    '<div class="mground">' + tpl(C.roundLabel,{n:mgRun.round, rounds:C.rounds}) + '</div>' +
    '<div class="capgrid" style="grid-template-columns:repeat(' + C.cols + ',1fr)">' + cells + '</div>' +
    '<div class="captimer"><i id="capbar" style="width:100%"></i></div>';
  mgRun.t0 = Date.now();
  mgRun.timer = setInterval(()=>{
    if (!mgRun || mgRun.kind !== 'captcha') return;
    const left = 1 - (Date.now() - mgRun.t0)/(C.timerSec*1000);
    const bar = $('capbar'); if (bar) bar.style.width = Math.max(0, left*100) + '%';
    if (left <= 0) capFail(C.failTimeToast);
  }, 100);
}
function capTap(i){
  if (!mgRun || mgRun.kind !== 'captcha' || mgRun.over || mgRun.failing) return;
  const C = MG.captcha;
  const cell = document.querySelector('.capcell[data-i="' + i + '"]');
  if (mgRun.good.has(i)){
    if (cell.classList.contains('hit')) return;
    cell.classList.add('hit');
    mgRun.found++;
    if (mgRun.found >= C.goodCount){
      clearInterval(mgRun.timer); mgRun.timer = null;
      if (mgRun.round >= C.rounds){ mgWin('captcha'); return; }
      mgRun.round++;
      capRound();
    }
  } else {
    cell.classList.add('boom');
    capFail(C.failWrongToast);
  }
}
function capFail(msg){
  if (!mgRun || mgRun.failing) return;
  clearInterval(mgRun.timer); mgRun.timer = null;
  mgRun.failing = true;
  toast(msg);
  mgRun.round = 1;
  setTimeout(()=>{
    if (mgRun && mgRun.kind === 'captcha' && !mgRun.over){ mgRun.failing = false; capRound(); }
  }, 450);
}

function doTap(x, y){
  if (!S.side || S.en < 1) return;
  const boosted = S.tut.active && S.tut.step === 'tap';
  /* FTUE-буст первых тапов × буст дохода от шифра (волна 21) */
  const val = (boosted ? TAP_VAL * CONFIG.tutorial.tapBoost : TAP_VAL) * boostMult();
  S.en -= 1; S.taps++; S.bytes += val;
  const tz = $('tapzone');
  $('tapArt').innerHTML = art('tap_' + S.side + '_hit');
  clearTimeout(doTap._h);
  doTap._h = setTimeout(()=>{ $('tapArt').innerHTML = art('tap_' + S.side); }, 120);
  const f = document.createElement('div');
  f.className = 'float'; f.textContent = '+' + val;
  const r = tz.getBoundingClientRect(), k = stageScale();   // клик в вьюпорт-px → дизайн-px сцены
  f.style.left = ((x - r.left) / k - 10) + 'px';
  f.style.top = ((y - r.top) / k - 20) + 'px';
  tz.appendChild(f);
  setTimeout(()=>f.remove(), 1000);
  if (boosted){
    S.tut.taps++;
    if (S.tut.taps >= CONFIG.tutorial.tapGoal) tutStep('nav'); else tutPaint();
  }
  paint();
}

        m = Math.floor(left%36e5/6e4), s = Math.floor(left%6e4/1e3);
  const p = n => String(n).padStart(2,'0');
  const ts = d + 'д ' + p(h) + ':' + p(m) + ':' + p(s);
  $('warTimer').textContent = ts;
  $('warTimer2').textContent = ts;   // дубль таймера в карточке «Битва за сеть» на главной

   арты вперёд. Список собирается ИЗ ART автоматически (новые ключи Миши подхватятся сами):
   сначала критичные первого экрана (тап-объекты, аватары, тумбы карт, имбы, постеры),
   потом остальное каскадом по 4 картинки, чтобы не душить сеть разом. ---- */
function preloadArt(){
  const urls = k => [...String(ART[k]).matchAll(/src="([^"]+)"/g)].map(m => m[1]);
  const prio = [], rest = [];
  for (const k of Object.keys(ART))
    (/^(tap_|avatar|card_|imba_|poster|combo|store_|onb)/.test(k) ? prio : rest).push(...urls(k));
  const q = [...new Set([...prio, ...rest])];
  let i = 0, inFlight = 0;
  const pump = ()=>{
    while (inFlight < 4 && i < q.length){
      const im = new Image(); inFlight++;
      im.onload = im.onerror = ()=>{ inFlight--; pump(); };
      im.src = q[i++];
    }
  };
  pump();
  window.__preloadQueued = q.length;   // маркер для смоука
}
preloadArt();
const tz = $('tapzone');
tz.addEventListener('touchstart', e=>{
  e.preventDefault();
  for (const t of e.changedTouches) doTap(t.clientX, t.clientY);
}, {passive:false});
tz.addEventListener('mousedown', e=>doTap(e.clientX, e.clientY));
window.addEventListener('resize', ()=>{ if (S.tut.active) tutPaint(); });
paintTasks();
paint();
</script>
